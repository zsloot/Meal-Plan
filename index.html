<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800;900&display=swap">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #fff;
    color: #000;
    font-family: 'Futura', 'Jost', 'Trebuchet MS', Arial, sans-serif;
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 580px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  h1 {
    font-size: 26px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }

  label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="date"],
  input[type="number"] {
    width: 100%;
    border: 2px solid #000;
    border-radius: 0;
    padding: 12px 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    background: #fff;
    color: #000;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="number"] {
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="text"]::placeholder {
    color: #bbb;
    font-weight: 700;
  }

  input[type="text"]:focus,
  input[type="date"]:focus,
  input[type="number"]:focus {
    box-shadow: 3px 3px 0 #000;
  }

  .field {
    margin-bottom: 24px;
  }

  .field-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }

  .field-row > .field {
    flex: 1;
    margin-bottom: 0;
  }

  .people-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }

  .people-row > .field {
    margin-bottom: 0;
  }

  .people-row > .field:first-child {
    width: 96px;
    flex-shrink: 0;
  }

  .people-row > .field:last-child {
    flex: 1;
  }

  .meals-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .meal-toggle {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .meal-label {
    display: inline-block;
    padding: 10px 16px;
    border: 2px solid #000;
    font-family: inherit;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    color: #000;
    transition: background 0.08s, color 0.08s;
  }

  .meal-toggle:focus-visible + .meal-label {
    box-shadow: 3px 3px 0 #000;
  }

  .meal-toggle:checked + .meal-label {
    background: #000;
    color: #fff;
  }

  .divider {
    border: none;
    border-top: 2px solid #000;
    margin: 40px 0;
  }

  .output-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .output-box {
    width: 100%;
    border: 2px solid #000;
    padding: 20px 22px;
    font-family: 'SF Mono', 'Fira Mono', 'Roboto Mono', 'Consolas', monospace;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.8;
    background: #f7f7f7;
    color: #000;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 100px;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .share-btn,
  .drafts-btn {
    flex: 1;
    padding: 16px 8px;
    border: 2px solid #000;
    border-radius: 0;
    font-family: inherit;
    font-weight: 800;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.08s, color 0.08s;
  }

  .share-btn {
    background: #000;
    color: #fff;
  }

  .share-btn:hover {
    background: #222;
  }

  .share-btn:active {
    background: #fff;
    color: #000;
  }

  .drafts-btn {
    background: #fff;
    color: #000;
  }

  .drafts-btn:hover {
    background: #f5f5f5;
  }

  .drafts-btn:active {
    background: #000;
    color: #fff;
  }

  .share-btn:focus-visible,
  .drafts-btn:focus-visible {
    box-shadow: 3px 3px 0 #000;
    outline: none;
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #000;
    color: #fff;
    padding: 12px 28px;
    font-family: inherit;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    .people-row {
      flex-direction: column;
      gap: 24px;
    }
    .people-row > .field:first-child {
      width: 100%;
    }
    .field-row {
      flex-direction: column;
      gap: 24px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Meal Plan Builder</h1>

  <div class="field">
    <label for="plan-name">Plan Name</label>
    <input type="text" id="plan-name" placeholder="Beach Week 2026">
  </div>

  <div class="people-row">
    <div class="field">
      <label for="people-count">People</label>
      <input type="number" id="people-count" min="1" max="99" value="4">
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <input type="text" id="notes" placeholder="one shellfish allergy">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="start-date">First Day</label>
      <input type="date" id="start-date">
    </div>
    <div class="field">
      <label for="end-date">Last Day</label>
      <input type="date" id="end-date">
    </div>
  </div>

  <label>Meals</label>
  <div class="meals-grid" id="meals-grid"></div>

  <hr class="divider">

  <p class="output-label">Output</p>
  <div class="output-box" id="output"></div>

  <div class="btn-row">
    <button class="share-btn" id="share-btn">Share Template</button>
    <button class="drafts-btn" id="drafts-btn">Drafts Action</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MEALS = [
  'BREAKFAST',
  'BRUNCH',
  'LUNCH',
  'SNACK',
  'COCKTAIL',
  'DINNER',
  'MIDNIGHT SNACK'
];

const DEFAULTS_ON = new Set(['BRUNCH', 'SNACK', 'DINNER']);

const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

const grid = document.getElementById('meals-grid');
MEALS.forEach(function(meal) {
  var id = 'meal-' + meal.replace(/\s+/g, '-').toLowerCase();
  var cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'meal-toggle';
  cb.id = id;
  cb.value = meal;
  cb.checked = DEFAULTS_ON.has(meal);
  cb.addEventListener('change', render);

  var lbl = document.createElement('label');
  lbl.className = 'meal-label';
  lbl.htmlFor = id;
  lbl.textContent = meal;

  grid.appendChild(cb);
  grid.appendChild(lbl);
});

var startInput = document.getElementById('start-date');
var endInput = document.getElementById('end-date');
var planName = document.getElementById('plan-name');
var peopleCount = document.getElementById('people-count');
var notesInput = document.getElementById('notes');
var output = document.getElementById('output');

var today = new Date();
var endDefault = new Date(today);
endDefault.setDate(endDefault.getDate() + 3);
startInput.value = fmtDate(today);
endInput.value = fmtDate(endDefault);

function fmtDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function parseLocal(str) {
  var p = str.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}

function getSelectedMeals() {
  return MEALS.filter(function(m) {
    return document.getElementById('meal-' + m.replace(/\s+/g, '-').toLowerCase()).checked;
  });
}

function render() {
  var meals = getSelectedMeals();
  var start = startInput.value;
  var end = endInput.value;

  if (!start || !end || meals.length === 0) {
    output.textContent = '';
    return;
  }

  var startDate = parseLocal(start);
  var endDate = parseLocal(end);

  if (endDate < startDate) {
    output.textContent = '';
    return;
  }

  var lines = [];
  var name = planName.value.trim();
  if (name) lines.push(name.toUpperCase());

  var count = parseInt(peopleCount.value) || 0;
  var note = notesInput.value.trim();
  var sub = '';
  if (count) sub += count + ' people';
  if (count && note) sub += ' - ';
  if (!count && note) sub += note;
  else if (note) sub += note;
  if (sub) lines.push(sub);

  if (lines.length > 0) lines.push('');

  var totalDays = Math.round((endDate - startDate) / 86400000) + 1;
  var cursor = new Date(startDate);
  var dayIndex = 0;

  while (cursor <= endDate) {
    var dayName = DAYS[cursor.getDay()];
    var monthName = MONTHS[cursor.getMonth()];
    var dateNum = cursor.getDate();
    lines.push(dayName + ' - ' + monthName + ' ' + dateNum);

    var dayMeals;
    if (dayIndex === 0 && totalDays > 1) {
      dayMeals = [meals[meals.length - 1]];
    } else if (dayIndex === totalDays - 1 && totalDays > 1) {
      dayMeals = [meals[0]];
    } else {
      dayMeals = meals;
    }

    for (var i = 0; i < dayMeals.length; i++) {
      lines.push('   ' + dayMeals[i] + ' - ');
    }

    lines.push('');
    cursor.setDate(cursor.getDate() + 1);
    dayIndex++;
  }

  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  output.textContent = lines.join('\n');
}

[startInput, endInput, planName, peopleCount, notesInput].forEach(function(el) {
  el.addEventListener('input', render);
});

render();

var shareBtn = document.getElementById('share-btn');
var draftsBtn = document.getElementById('drafts-btn');
var toast = document.getElementById('toast');

shareBtn.addEventListener('click', function() {
  var text = output.textContent;
  if (!text) return;
  shareText(text);
});

async function shareText(text) {
  if (navigator.share) {
    try {
      await navigator.share({ text: text });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('Copied to clipboard');
  } catch (e) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied to clipboard');
  }
}

var draftsScript = null;
fetch('meal-plan-builder.js')
  .then(function(r) { return r.text(); })
  .then(function(t) { draftsScript = t; });

draftsBtn.addEventListener('click', function() {
  if (draftsScript) {
    shareText(draftsScript);
  } else {
    fetch('meal-plan-builder.js')
      .then(function(r) { return r.text(); })
      .then(function(t) { draftsScript = t; shareText(t); })
      .catch(function() { showToast('Failed to load script'); });
  }
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 1800);
}
</script>

</body>
</html>
