<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan Builder</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;700;900&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #fff;
    color: #000;
    font-family: 'Futura', 'Nunito Sans', 'Trebuchet MS', Arial, sans-serif;
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 20px 60px;
  }

  h1 {
    font-size: 28px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 36px;
  }

  label {
    display: block;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="date"] {
    width: 100%;
    border: 2px solid #000;
    border-radius: 0;
    padding: 12px 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    background: #fff;
    color: #000;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="text"]::placeholder {
    color: #bbb;
    font-weight: 700;
  }

  input[type="text"]:focus,
  input[type="date"]:focus {
    border-color: #000;
    box-shadow: 3px 3px 0 #000;
  }

  .field {
    margin-bottom: 28px;
  }

  .field-row {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
  }

  .field-row .field {
    flex: 1;
    margin-bottom: 0;
  }

  .people-row {
    display: flex;
    gap: 16px;
    margin-bottom: 28px;
  }

  .people-row .field {
    margin-bottom: 0;
  }

  .people-row .field:first-child {
    width: 100px;
    flex-shrink: 0;
  }

  .people-row .field:last-child {
    flex: 1;
  }

  input[type="number"] {
    width: 100%;
    border: 2px solid #000;
    border-radius: 0;
    padding: 12px 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    background: #fff;
    color: #000;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="number"]:focus {
    border-color: #000;
    box-shadow: 3px 3px 0 #000;
  }

  .meals-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 28px;
  }

  .meal-toggle {
    display: none;
  }

  .meal-label {
    display: inline-block;
    padding: 10px 18px;
    border: 2px solid #000;
    font-family: inherit;
    font-weight: 900;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1px;
    cursor: pointer;
    user-select: none;
    transition: background 0.1s, color 0.1s;
    background: #fff;
    color: #000;
  }

  .meal-toggle:checked + .meal-label {
    background: #000;
    color: #fff;
  }

  .divider {
    border: none;
    border-top: 2px solid #000;
    margin: 36px 0;
  }

  .output-label {
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    margin-bottom: 12px;
  }

  .output-box {
    width: 100%;
    border: 2px solid #000;
    border-radius: 0;
    padding: 20px;
    font-family: 'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', monospace;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.7;
    background: #fff;
    color: #000;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 120px;
    resize: none;
    outline: none;
  }

  .share-btn {
    display: block;
    width: 100%;
    margin-top: 20px;
    padding: 16px;
    border: 2px solid #000;
    border-radius: 0;
    background: #000;
    color: #fff;
    font-family: inherit;
    font-weight: 900;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.1s, color 0.1s;
  }

  .share-btn:active {
    background: #fff;
    color: #000;
  }

  .copied-toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #000;
    color: #fff;
    padding: 12px 28px;
    font-family: inherit;
    font-weight: 900;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    opacity: 0;
    transition: opacity 0.2s, transform 0.2s;
    pointer-events: none;
  }

  .copied-toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }
</style>
</head>
<body>

<div class="container">
  <h1>Meal Plan Builder</h1>

  <div class="field">
    <label for="plan-name">Plan Name</label>
    <input type="text" id="plan-name" placeholder="Beach Week 2026">
  </div>

  <div class="people-row">
    <div class="field">
      <label for="people-count">People</label>
      <input type="number" id="people-count" min="1" max="99" value="4">
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <input type="text" id="notes" placeholder="one shellfish allergy">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="start-date">First Day</label>
      <input type="date" id="start-date">
    </div>
    <div class="field">
      <label for="end-date">Last Day</label>
      <input type="date" id="end-date">
    </div>
  </div>

  <label>Meals</label>
  <div class="meals-grid" id="meals-grid"></div>

  <hr class="divider">

  <div class="output-label">Output</div>
  <div class="output-box" id="output"></div>

  <button class="share-btn" id="share-btn">Share Meal Plan Template</button>
</div>

<div class="copied-toast" id="toast">Copied to clipboard</div>

<script>
const MEALS = [
  'BREAKFAST',
  'BRUNCH',
  'LUNCH',
  'SNACK',
  'COCKTAIL',
  'DINNER',
  'MIDNIGHT SNACK'
];

const DEFAULTS_ON = new Set(['BRUNCH', 'SNACK', 'DINNER']);

const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

const grid = document.getElementById('meals-grid');
MEALS.forEach(meal => {
  const id = 'meal-' + meal.replace(/\s+/g, '-').toLowerCase();
  const cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'meal-toggle';
  cb.id = id;
  cb.value = meal;
  cb.checked = DEFAULTS_ON.has(meal);
  cb.addEventListener('change', render);

  const lbl = document.createElement('label');
  lbl.className = 'meal-label';
  lbl.htmlFor = id;
  lbl.textContent = meal;

  grid.appendChild(cb);
  grid.appendChild(lbl);
});

const startInput = document.getElementById('start-date');
const endInput = document.getElementById('end-date');
const planName = document.getElementById('plan-name');
const peopleCount = document.getElementById('people-count');
const notesInput = document.getElementById('notes');
const output = document.getElementById('output');

// Default: today + 3 days
const today = new Date();
const todayStr = fmt(today);
const endDefault = new Date(today);
endDefault.setDate(endDefault.getDate() + 3);
startInput.value = todayStr;
endInput.value = fmt(endDefault);

function fmt(d) {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

function parseLocal(dateStr) {
  const [y, m, d] = dateStr.split('-').map(Number);
  return new Date(y, m - 1, d);
}

function getSelectedMeals() {
  return MEALS.filter(m => {
    const id = 'meal-' + m.replace(/\s+/g, '-').toLowerCase();
    return document.getElementById(id).checked;
  });
}

function render() {
  const meals = getSelectedMeals();
  const start = startInput.value;
  const end = endInput.value;

  if (!start || !end || meals.length === 0) {
    output.textContent = '';
    return;
  }

  const startDate = parseLocal(start);
  const endDate = parseLocal(end);

  if (endDate < startDate) {
    output.textContent = '';
    return;
  }

  let lines = [];

  const name = planName.value.trim();
  if (name) {
    lines.push(name.toUpperCase());
  }

  const count = parseInt(peopleCount.value) || '';
  const note = notesInput.value.trim();
  let subline = '';
  if (count) subline += count + ' people';
  if (count && note) subline += ' - ';
  if (note) subline += note;
  if (subline) lines.push(subline);

  if (lines.length > 0) lines.push('');

  const cursor = new Date(startDate);
  const totalDays = Math.round((endDate - startDate) / 86400000) + 1;

  let dayIndex = 0;
  while (cursor <= endDate) {
    const dayName = DAYS[cursor.getDay()];
    const monthName = MONTHS[cursor.getMonth()];
    const dateNum = cursor.getDate();

    lines.push(`${dayName} - ${monthName} ${dateNum}`);

    let dayMeals;
    if (dayIndex === 0 && totalDays > 1) {
      // First day: last meal only
      dayMeals = [meals[meals.length - 1]];
    } else if (dayIndex === totalDays - 1 && totalDays > 1) {
      // Last day: first meal only
      dayMeals = [meals[0]];
    } else {
      dayMeals = meals;
    }

    dayMeals.forEach(m => {
      lines.push(`    ${m} - `);
    });

    lines.push('');
    cursor.setDate(cursor.getDate() + 1);
    dayIndex++;
  }

  // Remove trailing blank line
  while (lines.length && lines[lines.length - 1] === '') lines.pop();

  output.textContent = lines.join('\n');
}

[startInput, endInput, planName, peopleCount, notesInput].forEach(el => {
  el.addEventListener('input', render);
});

render();

// Share
const shareBtn = document.getElementById('share-btn');
const toast = document.getElementById('toast');

shareBtn.addEventListener('click', async () => {
  const text = output.textContent;
  if (!text) return;

  if (navigator.share) {
    try {
      await navigator.share({ text });
      return;
    } catch (e) {
      // User cancelled or share failed, fall through to clipboard
      if (e.name === 'AbortError') return;
    }
  }

  try {
    await navigator.clipboard.writeText(text);
    showToast('Copied to clipboard');
  } catch (e) {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied to clipboard');
  }
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1800);
}
</script>

</body>
</html>
