<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meal Plan Builder</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@500;700;800;900&display=swap">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #fff;
    color: #000;
    font-family: 'Futura', 'Jost', 'Trebuchet MS', Arial, sans-serif;
    font-weight: 700;
    -webkit-font-smoothing: antialiased;
  }

  .container {
    max-width: 580px;
    margin: 0 auto;
    padding: 48px 20px 80px;
  }

  h1 {
    font-size: 26px;
    font-weight: 900;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 40px;
  }

  label {
    display: block;
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 8px;
  }

  input[type="text"],
  input[type="date"],
  input[type="number"] {
    width: 100%;
    border: 2px solid #000;
    border-radius: 0;
    padding: 12px 14px;
    font-family: inherit;
    font-weight: 700;
    font-size: 15px;
    background: #fff;
    color: #000;
    outline: none;
    -webkit-appearance: none;
    appearance: none;
  }

  input[type="number"] {
    -moz-appearance: textfield;
  }

  input[type="number"]::-webkit-inner-spin-button,
  input[type="number"]::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }

  input[type="text"]::placeholder {
    color: #bbb;
    font-weight: 700;
  }

  input[type="text"]:focus,
  input[type="date"]:focus,
  input[type="number"]:focus {
    box-shadow: 3px 3px 0 #000;
  }

  .field {
    margin-bottom: 24px;
  }

  .field-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }

  .field-row > .field {
    flex: 1;
    margin-bottom: 0;
  }

  .people-row {
    display: flex;
    gap: 16px;
    margin-bottom: 24px;
  }

  .people-row > .field {
    margin-bottom: 0;
  }

  .people-row > .field:first-child {
    width: 96px;
    flex-shrink: 0;
  }

  .people-row > .field:last-child {
    flex: 1;
  }

  .meals-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }

  .meal-toggle {
    position: absolute;
    opacity: 0;
    pointer-events: none;
  }

  .meal-label {
    display: inline-block;
    padding: 10px 16px;
    border: 2px solid #000;
    font-family: inherit;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    cursor: pointer;
    user-select: none;
    background: #fff;
    color: #000;
    transition: background 0.08s, color 0.08s;
  }

  .meal-toggle:focus-visible + .meal-label {
    box-shadow: 3px 3px 0 #000;
  }

  .meal-toggle:checked + .meal-label {
    background: #000;
    color: #fff;
  }

  .divider {
    border: none;
    border-top: 2px solid #000;
    margin: 40px 0;
  }

  .output-label {
    font-size: 10px;
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }

  .output-box {
    width: 100%;
    border: 2px solid #000;
    padding: 20px 22px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    line-height: 1.75;
    background: #fff;
    color: #000;
    white-space: pre-wrap;
    word-break: break-word;
    min-height: 100px;
  }

  .btn-row {
    display: flex;
    gap: 8px;
    margin-top: 16px;
  }

  .share-btn,
  .drafts-btn {
    flex: 1;
    padding: 16px 8px;
    border: 2px solid #000;
    border-radius: 0;
    font-family: inherit;
    font-weight: 800;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 2px;
    cursor: pointer;
    transition: background 0.08s, color 0.08s;
  }

  .share-btn {
    background: #000;
    color: #fff;
  }

  .share-btn:hover {
    background: #222;
  }

  .share-btn:active {
    background: #fff;
    color: #000;
  }

  .drafts-btn {
    background: #fff;
    color: #000;
  }

  .drafts-btn:hover {
    background: #f5f5f5;
  }

  .drafts-btn:active {
    background: #000;
    color: #fff;
  }

  .share-btn:focus-visible,
  .drafts-btn:focus-visible {
    box-shadow: 3px 3px 0 #000;
    outline: none;
  }

  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: #000;
    color: #fff;
    padding: 12px 28px;
    font-family: inherit;
    font-weight: 800;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 2px;
    opacity: 0;
    transition: opacity 0.15s, transform 0.15s;
    pointer-events: none;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  @media (max-width: 480px) {
    .people-row {
      flex-direction: column;
      gap: 24px;
    }
    .people-row > .field:first-child {
      width: 100%;
    }
    .field-row {
      flex-direction: column;
      gap: 24px;
    }
  }
</style>
</head>
<body>

<div class="container">
  <h1>Meal Plan Builder</h1>

  <div class="field">
    <label for="plan-name">Plan Name</label>
    <input type="text" id="plan-name" placeholder="Beach Week 2026">
  </div>

  <div class="people-row">
    <div class="field">
      <label for="people-count">People</label>
      <input type="number" id="people-count" min="1" max="99" value="4">
    </div>
    <div class="field">
      <label for="notes">Notes</label>
      <input type="text" id="notes" placeholder="one shellfish allergy">
    </div>
  </div>

  <div class="field-row">
    <div class="field">
      <label for="start-date">First Day</label>
      <input type="date" id="start-date">
    </div>
    <div class="field">
      <label for="end-date">Last Day</label>
      <input type="date" id="end-date">
    </div>
  </div>

  <label>Meals</label>
  <div class="meals-grid" id="meals-grid"></div>

  <hr class="divider">

  <p class="output-label">Output</p>
  <div class="output-box" id="output"></div>

  <div class="btn-row">
    <button class="share-btn" id="share-btn">Share Template</button>
    <button class="drafts-btn" id="drafts-btn">Drafts Action</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const MEALS = [
  'BREAKFAST',
  'BRUNCH',
  'LUNCH',
  'SNACK',
  'COCKTAIL',
  'DINNER',
  'MIDNIGHT SNACK'
];

const DEFAULTS_ON = new Set(['BRUNCH', 'SNACK', 'DINNER']);

const DAYS = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
const MONTHS = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];

const grid = document.getElementById('meals-grid');
MEALS.forEach(function(meal) {
  var id = 'meal-' + meal.replace(/\s+/g, '-').toLowerCase();
  var cb = document.createElement('input');
  cb.type = 'checkbox';
  cb.className = 'meal-toggle';
  cb.id = id;
  cb.value = meal;
  cb.checked = DEFAULTS_ON.has(meal);
  cb.addEventListener('change', render);

  var lbl = document.createElement('label');
  lbl.className = 'meal-label';
  lbl.htmlFor = id;
  lbl.textContent = meal;

  grid.appendChild(cb);
  grid.appendChild(lbl);
});

var startInput = document.getElementById('start-date');
var endInput = document.getElementById('end-date');
var planName = document.getElementById('plan-name');
var peopleCount = document.getElementById('people-count');
var notesInput = document.getElementById('notes');
var output = document.getElementById('output');

var today = new Date();
var endDefault = new Date(today);
endDefault.setDate(endDefault.getDate() + 3);
startInput.value = fmtDate(today);
endInput.value = fmtDate(endDefault);

function fmtDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function parseLocal(str) {
  var p = str.split('-').map(Number);
  return new Date(p[0], p[1] - 1, p[2]);
}

function getSelectedMeals() {
  return MEALS.filter(function(m) {
    return document.getElementById('meal-' + m.replace(/\s+/g, '-').toLowerCase()).checked;
  });
}

function render() {
  var meals = getSelectedMeals();
  var start = startInput.value;
  var end = endInput.value;

  if (!start || !end || meals.length === 0) {
    output.textContent = '';
    return;
  }

  var startDate = parseLocal(start);
  var endDate = parseLocal(end);

  if (endDate < startDate) {
    output.textContent = '';
    return;
  }

  var lines = [];
  var name = planName.value.trim();
  if (name) lines.push(name.toUpperCase());

  var count = parseInt(peopleCount.value) || 0;
  var note = notesInput.value.trim();
  var sub = '';
  if (count) sub += count + ' people';
  if (count && note) sub += ' - ';
  if (!count && note) sub += note;
  else if (note) sub += note;
  if (sub) lines.push(sub);

  if (lines.length > 0) lines.push('');

  var totalDays = Math.round((endDate - startDate) / 86400000) + 1;
  var cursor = new Date(startDate);
  var dayIndex = 0;

  while (cursor <= endDate) {
    var dayName = DAYS[cursor.getDay()];
    var monthName = MONTHS[cursor.getMonth()];
    var dateNum = cursor.getDate();
    lines.push(dayName + ' - ' + monthName + ' ' + dateNum);

    var dayMeals;
    if (dayIndex === 0 && totalDays > 1) {
      dayMeals = [meals[meals.length - 1]];
    } else if (dayIndex === totalDays - 1 && totalDays > 1) {
      dayMeals = [meals[0]];
    } else {
      dayMeals = meals;
    }

    for (var i = 0; i < dayMeals.length; i++) {
      lines.push('    ' + dayMeals[i] + ' - ');
    }

    lines.push('');
    cursor.setDate(cursor.getDate() + 1);
    dayIndex++;
  }

  while (lines.length && lines[lines.length - 1] === '') lines.pop();
  output.textContent = lines.join('\n');
}

[startInput, endInput, planName, peopleCount, notesInput].forEach(function(el) {
  el.addEventListener('input', render);
});

render();

var shareBtn = document.getElementById('share-btn');
var draftsBtn = document.getElementById('drafts-btn');
var toast = document.getElementById('toast');

shareBtn.addEventListener('click', function() {
  var text = output.textContent;
  if (!text) return;
  shareText(text);
});

async function shareText(text) {
  if (navigator.share) {
    try {
      await navigator.share({ text: text });
      return;
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  try {
    await navigator.clipboard.writeText(text);
    showToast('Copied to clipboard');
  } catch (e) {
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('Copied to clipboard');
  }
}

draftsBtn.addEventListener('click', function() {
  var script = document.getElementById('drafts-script').textContent;
  shareText(script);
});

function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(function() { toast.classList.remove('show'); }, 1800);
}
</script>

<script type="text/plain" id="drafts-script">// Meal Plan Builder — Drafts Action
// Builds a plain-text meal planning template via a series of prompts.

var MEALS = [
  "BREAKFAST",
  "BRUNCH",
  "LUNCH",
  "SNACK",
  "COCKTAIL",
  "DINNER",
  "MIDNIGHT SNACK"
];

var DEFAULTS_ON = ["BRUNCH", "SNACK", "DINNER"];

var DAYS = ["SUNDAY", "MONDAY", "TUESDAY", "WEDNESDAY", "THURSDAY", "FRIDAY", "SATURDAY"];
var MONTHS = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];

// --- Step 1: Plan details ---

var p1 = new Prompt();
p1.title = "Meal Plan Builder";
p1.message = "Set up your meal plan.";

p1.addTextField("planName", "Plan Name", "", { placeholder: "Beach Week 2026" });
p1.addTextField("peopleCount", "Number of People", "4", { keyboard: true });
p1.addTextField("notes", "Notes", "", { placeholder: "one shellfish allergy" });
p1.addDatePicker("startDate", "First Day", new Date(), { mode: "date" });

var endDefault = new Date();
endDefault.setDate(endDefault.getDate() + 3);
p1.addDatePicker("endDate", "Last Day", endDefault, { mode: "date" });

p1.addButton("Next");

if (!p1.show()) {
  context.cancel();
  app.displayInfoMessage("Cancelled");
}
else {

var planName = p1.fieldValues["planName"].trim();
var peopleCount = parseInt(p1.fieldValues["peopleCount"]) || 0;
var notes = p1.fieldValues["notes"].trim();
var startDate = p1.fieldValues["startDate"];
var endDate = p1.fieldValues["endDate"];

if (endDate < startDate) {
  app.displayErrorMessage("Last day must be on or after first day.");
  context.cancel();
}
else {

// --- Step 2: Select meals ---

var p2 = new Prompt();
p2.title = "Select Meals";
p2.message = "Choose which meals repeat each day.";

for (var i = 0; i < MEALS.length; i++) {
  p2.addSwitch(MEALS[i], MEALS[i], DEFAULTS_ON.indexOf(MEALS[i]) !== -1);
}

p2.addButton("Build Template");

if (!p2.show()) {
  context.cancel();
  app.displayInfoMessage("Cancelled");
}
else {

var selectedMeals = [];
for (var i = 0; i < MEALS.length; i++) {
  if (p2.fieldValues[MEALS[i]]) {
    selectedMeals.push(MEALS[i]);
  }
}

if (selectedMeals.length === 0) {
  app.displayErrorMessage("Select at least one meal.");
  context.cancel();
}
else {

// --- Build output ---

var lines = [];

if (planName) {
  lines.push(planName.toUpperCase());
}

var sub = "";
if (peopleCount) sub += peopleCount + " people";
if (peopleCount && notes) sub += " - ";
if (notes) sub += notes;
if (sub) lines.push(sub);

if (lines.length > 0) lines.push("");

var startMs = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate()).getTime();
var endMs = new Date(endDate.getFullYear(), endDate.getMonth(), endDate.getDate()).getTime();
var totalDays = Math.round((endMs - startMs) / 86400000) + 1;

var cursor = new Date(startDate.getFullYear(), startDate.getMonth(), startDate.getDate());
var dayIndex = 0;

while (dayIndex < totalDays) {
  var dayName = DAYS[cursor.getDay()];
  var monthName = MONTHS[cursor.getMonth()];
  var dateNum = cursor.getDate();

  lines.push(dayName + " - " + monthName + " " + dateNum);

  var dayMeals;
  if (dayIndex === 0 && totalDays > 1) {
    dayMeals = [selectedMeals[selectedMeals.length - 1]];
  } else if (dayIndex === totalDays - 1 && totalDays > 1) {
    dayMeals = [selectedMeals[0]];
  } else {
    dayMeals = selectedMeals;
  }

  for (var m = 0; m < dayMeals.length; m++) {
    lines.push("    " + dayMeals[m] + " - ");
  }

  lines.push("");
  cursor.setDate(cursor.getDate() + 1);
  dayIndex++;
}

while (lines.length && lines[lines.length - 1] === "") lines.pop();

var output = lines.join("\n");

var d = new Draft();
d.content = output;
d.update();

editor.load(d);
app.displaySuccessMessage("Meal plan template created!");

} // selectedMeals check
} // p2 show
} // date validation
} // p1 show
</script>

</body>
</html>
